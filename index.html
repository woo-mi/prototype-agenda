<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototype Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #FFFFFF;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .section {
    width: 440px;
    max-width: calc(100% - 48px);
  }
  .section-header {
    font-size: 14px;
    font-weight: 500;
    color: #666666;
    margin: 0 2px 10px;
  }
  .agenda {
    width: 100%;
    height: fit-content;
    background: #FFFFFF;
    border: 1px solid #E8E8E8;
    border-radius: 10px;
    overflow: hidden;
  }
  .agenda a, .agenda .row {
    display: flex;
    align-items: center;
    padding: 0 20px;
    height: 52px;
    text-decoration: none;
    border-bottom: 1px solid #EDEDED;
    font-size: 15px;
    font-weight: 400;
    color: #4B4B4B;
    transition: background-color 0.12s ease;
  }
  .agenda a:last-child, .agenda .row:last-child { border-bottom: none; }
  .agenda a:hover { background: #FAFAFA; }
</style>
</head>
<body>

<div class="section">
  <div class="section-header">Create agent from</div>
  <nav class="agenda">
    <a href="https://woo-mi.github.io/agent-advanced-automated-version/">
      Home
    </a>
    <a href="https://woo-mi.github.io/agent-list-view/">
      List view
    </a>
    <div class="row">
      Chat
    </div>
  </nav>
</div>

</body>
</html>
